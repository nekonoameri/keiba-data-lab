name: Import historical JRA dataset
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-historical.yml'
      - 'site/import_historical_dataset.py'
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download CC BY 4.0 historical dataset
        run: |
          python -m pip install kagglehub
          python - <<'PY'
          import kagglehub, shutil
          from pathlib import Path
          p=Path(kagglehub.dataset_download("takamotoki/jra-horse-racing-dataset"))
          files=sorted(p.rglob("*.csv"))
          race=[x for x in files if "race_result" in x.name]
          if not race: raise SystemExit("race_result CSV not found")
          shutil.copy2(race[0], "site/data/historical_race_result.csv")
          for key in ("odds","laptime","corner_passing_order"):
              matches=[x for x in files if key in x.name]
              if matches: shutil.copy2(matches[0], f"site/data/historical_{key}.csv")
          print("dataset CSV files:")
          for x in files: print(x.name, x.stat().st_size)
          print("race result:",race[0])
          PY
      - name: Normalize historical runners and inventory extras
        run: |
          python site/import_historical_dataset.py site/data/historical_race_result.csv --out runners.csv
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path("site/data"); out={}
          for key in ("odds","laptime","corner_passing_order"):
              p=root/f"historical_{key}.csv"
              if not p.exists(): continue
              with p.open(encoding="utf-8-sig",errors="replace") as f:
                  rd=csv.reader(f); header=next(rd); n=sum(1 for _ in rd)
              out[key]={"rows":n,"columns":header}
          (root/"historical-extra-manifest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(out)
          PY
      - name: Verify non-empty
        run: |
          python - <<'PY'
          import csv
          p="site/runners.csv"
          n=sum(1 for _ in csv.DictReader(open(p,encoding="utf-8")))
          print("historical runners:",n)
          if n < 1000: raise SystemExit("historical import unexpectedly small")
          PY
      - name: Build site from historical data
        run: |
          cd site
          python import_csv.py
          python validate_data.py
          python build_site_data.py
          python generate_db_race_pages.py
      - name: Commit generated site data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f site/runners.csv site/data/historical_race_result.csv site/data/historical_odds.csv site/data/historical_laptime.csv site/data/historical_corner_passing_order.csv
          git add -f site/site-data.json site/site-data.js site/data/db-race-page-manifest.json site/data/historical-extra-manifest.json site/race-archive.html || true
          git commit -m "Build site from historical JRA data" || exit 0
          git push
