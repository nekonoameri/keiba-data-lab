name: Import historical JRA dataset
on:
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download CC BY 4.0 historical dataset
        run: |
          python -m pip install kagglehub
          python - <<'PY'
          import kagglehub, shutil
          from pathlib import Path
          p=Path(kagglehub.dataset_download("takamotoki/jra-horse-racing-dataset"))
          files=list(p.rglob("*race_result*.csv"))
          if not files: raise SystemExit("race_result CSV not found")
          shutil.copy2(files[0], "site/data/historical_race_result.csv")
          print(files[0])
          PY
      - name: Normalize historical runners
        run: python site/import_historical_dataset.py site/data/historical_race_result.csv --out runners-historical.csv
      - name: Verify non-empty
        run: |
          python - <<'PY'
          import csv
          p="site/runners-historical.csv"
          n=sum(1 for _ in csv.DictReader(open(p,encoding="utf-8")))
          print("historical runners:",n)
          if n < 1000: raise SystemExit("historical import unexpectedly small")
          PY
      - name: Commit normalized historical data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/runners-historical.csv
          git commit -m "Import normalized historical JRA runners" || exit 0
          git push
