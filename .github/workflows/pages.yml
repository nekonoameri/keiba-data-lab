name: Deploy KEIBA DATA LAB

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt
      - name: Build verified JRA data
        shell: bash
        run: |
          pip install -r site/requirements.txt
          cd site
          python update_site.py --fetch --year 2026 --limit 3 --base-url "https://nekonoameri.github.io/keiba-data-lab/"
          python - <<'PY'
          import json
          d=json.load(open("data/db-race-page-manifest.json",encoding="utf-8"))
          assert d["races"] > 0, "No verified races generated; refusing empty deployment"
          print("Verified races:",d["races"],"dates:",d["dates"])
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
