name: Deploy KEIBA DATA LAB

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site
        shell: bash
        run: |
          set -e
          rm -rf _site _unpacked
          mkdir _site _unpacked
          if [ -f "KEIBA-DATA-LAB-v13.zip" ]; then
            ZIP_FILE="KEIBA-DATA-LAB-v13.zip"
          elif [ -f "KEIBA-DATA-LAB-v13-FINAL.zip" ]; then
            ZIP_FILE="KEIBA-DATA-LAB-v13-FINAL.zip"
          else
            ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*v13*.zip' | head -1)
          fi
          if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
            echo "Deploying $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d _unpacked
            SITE_DIR=$(find _unpacked -type f -name index.html -printf '%h\n' | head -1)
            if [ -z "$SITE_DIR" ]; then
              echo "No index.html found in v13 ZIP."
              exit 1
            fi
            cp -a "$SITE_DIR"/. _site/
          else
            echo "v13 ZIP not found."
            exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

# Redeploy after enabling GitHub Actions as Pages source
