name: Deploy KEIBA DATA LAB

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify generated historical data
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open("site/data/db-race-page-manifest.json",encoding="utf-8"))
          s=json.load(open("site/site-data.json",encoding="utf-8"))
          assert d.get("races",0) > 0, "No generated races; refusing empty deployment"
          assert len(s.get("jockey_rankings",[])) > 0, "No jockey rankings; refusing empty deployment"
          print("Races:",d["races"],"Jockey rankings:",len(s["jockey_rankings"]))
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
