name: Update verified JRA data

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-data.yml"
      - "site/jra_result_adapter.py"
      - "site/build_site_data.py"
  workflow_dispatch:
  schedule:
    # Race-day refreshes (JST 09:15, 12:15, 15:15, 18:15) on Saturdays/Sundays.\n    - cron: "15 0,3,6,9 * * 6,0"

permissions:
  contents: write

concurrency:
  group: jra-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt
      - name: Install dependencies
        run: pip install -r site/requirements.txt
      - name: Import latest official JRA results without destroying historical build
        shell: bash
        run: |
          cat > site/latest-jra-results.txt <<'EOF'
          https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde0106202604060120260920%2F40
          https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde0106202604060320260920%2FAA
          https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde1006202604060420260920%2F3E
          https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde1006202604060720260920%2F5D
          https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde1006202604060820260920%2F12
          https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde0106202604060920260920%2FE8
          https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde0106202604061020260920%2FDD
          https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde0106202604061220260920%2F47
          https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde1009202604060220260920%2FB2
          https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde0109202604061020260920%2FBB
          EOF
          cd site
          DB_RACES=$(python -c 'import sqlite3; c=sqlite3.connect("keiba.db"); print(c.execute("select count(*) from races").fetchone()[0])' 2>/dev/null || echo 0)
          if [ "$DB_RACES" -ge 1000 ]; then
            python jra_result_adapter.py latest-jra-results.txt --delay 1.0
            python validate_data.py
            python build_site_data.py
            python - <<'PY'
          import json
          d=json.load(open("site-data.json"))
          print("coverage",d.get("meta"))
          if not d.get("jockey_rankings"):
              raise SystemExit("jockey rankings missing after current-data import")
          PY
          else
            echo "keiba.db is not present; preserve committed historical site-data and verify JRA route only"
            python - <<'PY'
          import urllib.request
          u="https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde0106202604061220260920%2F47"
          req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
          b=urllib.request.urlopen(req,timeout=30).read()
          if len(b)<10000: raise SystemExit("JRA result response unexpectedly small")
          print("JRA route verified",len(b))
          PY
          fi
      - name: Verify published dataset
        run: |
          python - <<'PY'
          import json
          d=json.load(open("site/site-data.json"))
          m=d.get("meta",{})
          if int(m.get("race_count") or 0)<1000: raise SystemExit("published race coverage unexpectedly small")
          if not d.get("jockey_rankings"): raise SystemExit("published jockey rankings missing")
          print("published dataset verified",m)
          PY
      - name: Commit generated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- site/site-data.js site/site-data.json site/keiba.db site/races site/race-archive.html site/sitemap.xml site/data/db-race-page-manifest.json || true
          if git diff --cached --quiet; then
            echo "No verified-data changes"
          else
            git commit -m "Update verified JRA race data"
            git push
          fi
