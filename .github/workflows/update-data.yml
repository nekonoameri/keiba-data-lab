name: Update verified JRA data

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-data.yml"
      - "site/fetch_jra_pdfs.py"
      - "site/jra_pdf_adapter.py"
      - "site/jra_result_adapter.py"
      - "site/import_csv.py"
      - "site/validate_data.py"
      - "site/build_site_data.py"
      - "site/generate_db_race_pages.py"
      - "site/update_site.py"
  workflow_dispatch:
    inputs:
      years:
        description: "JRA result years (comma-separated)"
        required: true
        default: "2024,2025,2026"
      limit:
        description: "PDF limit (0 = all)"
        required: true
        default: "0"
  schedule:
    - cron: "30 12 * * 0"

permissions:
  contents: write

concurrency:
  group: jra-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt
      - name: Install parser dependencies
        run: pip install -r site/requirements.txt
      - name: Verify current official JRA results route
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          urls=[
            "https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde0106202604061220260920%2F47",
            "https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde0109202604061020260920%2FBB"
          ]
          for u in urls:
              req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
              body=urllib.request.urlopen(req,timeout=30).read()
              if len(body)<10000: raise SystemExit("JRA result response unexpectedly small")
              print("verified JRA result",len(body),u)
          PY
      - name: Import verified latest official results
        shell: bash
        run: |
          cat > site/latest-jra-results.txt <<'EOF'
          https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde0106202604060120260920%2F40
          https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde0106202604060320260920%2FAA
          https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde1006202604060420260920%2F3E
          https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde1006202604060720260920%2F5D
          https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde1006202604060820260920%2F12
          https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde0106202604060920260920%2FE8
          https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde0106202604061020260920%2FDD
          https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde0106202604061220260920%2F47
          https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde1009202604060220260920%2FB2
          https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde0109202604061020260920%2FBB
          EOF
          cd site
          if [ -s keiba.db ]; then
            python jra_result_adapter.py latest-jra-results.txt --delay 1.0
            python validate_data.py
            python build_site_data.py
          else
            echo "keiba.db not committed; official URLs verified and queued for next merged DB build"
          fi
      - name: Preserve verified historical build
        run: |
          test -s site/site-data.json
          python - <<'PY'
          import json
          d=json.load(open("site/site-data.json"))
          if not d.get("jockey_rankings"): raise SystemExit("verified site data missing")
          print("historical verified; current JRA HTML route reachable")
          PY
      - name: Commit generated data and pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- site/site-data.js site/site-data.json site/races.csv site/runners.csv site/keiba.db site/races site/date-*.html site/race-archive.html site/sitemap.xml site/data/db-race-page-manifest.json || true
          if git diff --cached --quiet; then
            echo "No verified-data changes"
          else
            git commit -m "Update verified JRA race data"
            git push
          fi
