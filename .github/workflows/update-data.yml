name: Update verified JRA data

on:
  workflow_dispatch:
    inputs:
      years:
        description: "JRA result years (comma-separated)"
        required: true
        default: "2024,2025,2026"
      limit:
        description: "PDF limit (0 = all)"
        required: true
        default: "0"
  schedule:
    - cron: "30 12 * * 0"

permissions:
  contents: write

concurrency:
  group: jra-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt
      - name: Install parser dependencies
        run: pip install -r site/requirements.txt
      - name: Fetch and rebuild verified data
        shell: bash
        run: |
          YEARS="${{ github.event.inputs.years || '2024,2025,2026' }}"
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          cd site
          python update_site.py --fetch --years "$YEARS" --limit "$LIMIT" --base-url "https://nekonoameri.github.io/keiba-data-lab/"
      - name: Commit generated data and pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- site/site-data.js site/site-data.json site/races.csv site/runners.csv site/keiba.db site/races site/date-*.html site/race-archive.html site/sitemap.xml site/data/db-race-page-manifest.json || true
          if git diff --cached --quiet; then
            echo "No verified-data changes"
          else
            git commit -m "Update verified JRA race data"
            git push
          fi
